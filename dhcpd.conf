# /etc/dhcp/dhcpd.conf
# VDBP Campus Centralized DHCP Server Configuration
# Hardware: IBM System x3100 M4 | OS: Ubuntu Server (Headless)
#
# SECURITY NOTE: All IP addresses in this file are illustrative examples
# only and do not reflect the actual network topology.
#
# Ranges are .10 to .240 to protect gateways (.253) and static
# infrastructure devices (.241-.252) from being handed out.
# Copy this file to /etc/dhcp/dhcpd.conf on the DHCP server.

# --- Global Settings ---
default-lease-time 86400;
max-lease-time 172800;
authoritative;

option domain-name "vdbp.campus.local";
option domain-name-servers 192.0.2.1, 192.0.2.2;

log-facility local7;

# ==========================================================================
# SECTOR 1: INFRASTRUCTURE VLANs  (10.10.x.0/24)
# ==========================================================================

# VLAN 2  - Voice / VoIP Phones
subnet 10.10.2.0 netmask 255.255.255.0 {
  range 10.10.2.10 10.10.2.240;
  option routers 10.10.2.253;
  option domain-name-servers 192.0.2.1, 192.0.2.2;
  default-lease-time 3600;
  max-lease-time 7200;
}

# VLAN 5  - Security Devices (CCTV / Access Control)
subnet 10.10.5.0 netmask 255.255.255.0 {
  range 10.10.5.10 10.10.5.240;
  option routers 10.10.5.253;
  option domain-name-servers 192.0.2.1, 192.0.2.2;
}

